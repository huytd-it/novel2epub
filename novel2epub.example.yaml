# ============================================================
# novel2epub — mẫu seed cho SQLite DB mới
# `python scripts/init_db.py` đọc file này để tạo defaults và source presets.
# Runtime KHÔNG đọc YAML; chỉnh cấu hình DB hiện tại qua Web UI.
#
# 2 khối:
#   defaults: phần DÙNG CHUNG cho mọi ebook (prompt dịch, style, output...).
#   ebooks  : mỗi ebook CHỈ khai phần KHÁC với defaults (deep-merge lên defaults).
# Source preset nếu có nằm trong khối `sources:` của chính mẫu này.
#
# Config hiệu lực = defaults -> source preset -> ebook override.
# `translate` và `ai` có thể override theo ebook. Riêng reader.url,
# service_key, timeout_seconds và batch_size chỉ lấy từ defaults.
# Chọn ebook khi chạy: `python -m novel2epub -e <slug> <command>`.
# Đổi DB runtime qua ENV: NOVEL2EPUB_DB=/đường/dẫn/khác.db
# ============================================================

defaults:
  # AI backend cho biên tập (glossary suggest/rewrite/evaluate).
  # Tách riêng khỏi translate.openai để dùng provider/model khác với backend dịch.
  # Nếu không khai báo, mặc định dùng translate.openai (tương thích ngược).
  # OpenCode Go (https://opencode.ai/docs/go/) — endpoint & model gợi ý:
  #   base_url: "https://opencode.ai/zen/go/v1"
  #   model:    "opencode-go/minimax-m3"   # format opencode-go/<model-id>
  #                                       # các model khác: kimi-k2.7-code, deepseek-v4-flash,
  #                                       # qwen3.7-plus, glm-5.1, mimo-v2.5-pro...
  ai:
    openai:
      base_url: "https://opencode.ai/zen/go/v1"
      api_key: ""
      model: "opencode-go/kimi-k2.6"
      timeout_seconds: 600
      temperature: 0.7

  crawl:
    # Scrapling là engine duy nhất. 3 mode: fetcher (mặc định), stealthy, dynamic.
    scrapling:
      mode: fetcher
      solve_cloudflare: false   # chỉ dùng cho mode stealthy
      network_idle: true        # stealthy/dynamic
      impersonate: ""           # TLS fingerprint cho fetcher (vd "chrome")
      # Vượt chặn ISP với trang Trung Quốc mà KHÔNG cần VPN toàn máy:
      proxy: ""                 # SOCKS5/HTTP proxy cho mọi request crawl,
                                # vd qua node Tailscale: "socks5://100.x.y.z:1080"
      dns_over_https: false     # DNS qua Cloudflare DoH (vượt DNS poisoning),
                                # chỉ áp dụng mode stealthy/dynamic
    delay_seconds: 1.0
    content_selector: ""        # CSS vùng nội dung chương, vd "#content"
    headless: true              # stealthy/dynamic mode
    next_page_selector: ""      # phân trang trong 1 chương (vd "a#pager_next")
    max_pages_per_chapter: 10
    toc_next_page_selector: ""  # CSS "trang kế" của mục lục nhiều trang (vd "a.next")
    toc_max_pages: 5            # số trang mục lục tối đa
    max_chapters: 0             # 0 = tải tất cả
    retry:
      attempts: 3
      delay_seconds: 5.0
      backoff: 2.0
      max_delay_seconds: 120.0
      respect_retry_after: true

  translate:
    type: hachimimt            # hachimimt | openai | google | libretranslate | none
    # Nguồn tiếng Việt (truyện VN, không cần dịch): source_language: vi
    # → bước dịch chỉ copy nguyên văn raw → translated, không gọi AI/model.
    # source_language: ""       # "" = Trung (mặc định) | en | vi
    style:
      tone: "mượt, tự nhiên, có chất cổ trang"
      pronoun_policy: contextual
      title_mode: creative
      han_viet_level: balanced
      keep_paragraphs: true
    retry: { attempts: 1, delay_seconds: 0.0 }
    chunk: { max_chars: 1500, overlap_paragraphs: 0 }
    delay_seconds: 0.5
    # Giới hạn TỔNG ký tự một prompt gửi AI (prompt mẫu + glossary + nội dung).
    # Dịch chương: tự chia đoạn nhỏ hơn; batch dịch: cắt batch sớm hơn.
    # 0 = không giới hạn.
    prompt_max_chars: 7000
    # Preset: "go" (mặc định OpenCode Go) | "omniroute" (OmniRoute gateway —
    # 237 providers qua 1 endpoint, tự capture cost/tokens/latency từ
    # X-OmniRoute-* headers nếu response từ OmniRoute).
    preset: ""
    openai:
      base_url: "https://opencode.ai/zen/go/v1"
      api_key: ""
      model: "opencode-go/kimi-k2.6"
      timeout_seconds: 600
      temperature: 0.7
    hachimimt:
      model_key: "HachimiMT-60"
      backend: "ctranslate2"
      beam_size: 2
      chunk_mode: "sentence"
    # LibreTranslate: self-hosted translation API (https://github.com/LibreTranslate/LibreTranslate)
    # type: libretranslate
    # libretranslate:
    #   base_url: "http://localhost:5000"
    #   api_key: ""
    #   source_language: "zh"
    #   target_language: "vi"

    # ---- OmniRoute gateway ----
    # Khi preset=omniroute, trỏ base_url vào OmniRoute (mặc định chạy local
    # ở cổng 20128) — 237 providers (90+ free) qua 1 endpoint duy nhất.
    # Tự động capture cost/tokens/latency từ X-OmniRoute-* headers (chỉ áp
    # dụng khi response thực sự từ OmniRoute; provider thường → meta rỗng).
    #
    # Cài OmniRoute:
    #   docker run -d -p 20128:20128 diegosouzapw/omniroute
    #   # hoặc: npm i -g omniroute && omniroute
    #
    # Ví dụ config ebook:
    #   vi-du-truyen:
    #     translate:
    #       type: openai
    #       preset: omniroute
    #       openai:
    #         base_url: "http://localhost:20128/v1"
    #         api_key: "sk-..."  # API key từ OmniRoute dashboard
    #         model: "auto"  # hoặc model id cụ thể như "cc/claude-opus-4-6"
    #         timeout_seconds: 600
    #
    # Xem chi tiết: https://github.com/diegosouzapw/OmniRoute

  output:
    data_dir: data

  queue:
    translate_workers: 2  # số job translate/batch-translate chạy song song
    crawl_workers: 2      # số job crawl chạy song song

  # ---- Đẩy chương lên app đọc novel-reader (Supabase) ----
  # Chỉ đẩy phần THAY ĐỔI: chương mới được thêm, chương đã biên tập lại được
  # cập nhật mà GIỮ NGUYÊN chapters.id (nên bookmark / tiến độ đọc / review bên
  # Reader không hỏng), chương không đổi thì bỏ qua. Không bao giờ xoá gì.
  #
  # 4 field dưới đây dùng CHUNG cho mọi ebook — chỉ đọc từ `defaults:`, đặt
  # trong khối ebook sẽ bị bỏ qua (để service_key chỉ nằm đúng một chỗ).
  reader:
    url: ""          # https://<ref>.supabase.co — KHÔNG kèm /rest/v1
    service_key: ""  # SUPABASE_SERVICE_ROLE_KEY — bypass toàn bộ RLS, không chia sẻ
    timeout_seconds: 60
    batch_size: 50   # số chương mỗi request


ebooks:
  # Khối này chỉ minh họa cấu trúc export/import. init_db chỉ seed defaults và
  # sources; hãy tạo ebook thật qua Web UI sau khi khởi động.
  vi-du-truyen:
    name: "Tên hiển thị ở dashboard"
    novel:
      title: "Tên truyện (tiếng Việt)"
      author: "Tác giả"
      language: vi
      slug: vi-du-truyen
    crawl:
      toc_url: "https://www.shuhaige.net/17619/"
      chapter_link_pattern: '/17619/\d+\.html'
      content_selector: '#content'
      scrapling:
        mode: fetcher
        impersonate: chrome
    # Phần `reader` đặt riêng từng truyện (kết nối Supabase ở `defaults:`).
    reader:
      slug: ""           # books.slug bên Reader; để trống = dùng novel.slug
      free_chapters: 5   # số chương ĐẦU đọc miễn phí
      published: false   # books.is_published, CHỈ set khi tạo sách lần đầu
