name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify backend import
        run: python -c "import app.main"
      - name: Test core API contracts
        run: >-
          python -m pytest -q
          tests/test_ui_add_ebook.py
          tests/test_ui_settings_contract.py
          tests/test_routes_glossary.py
          tests/test_routes_characters.py
          tests/test_routes_idioms.py
          tests/test_routes_notes.py
          tests/test_routes_para_edit.py
          tests/test_webui_revision_routes.py
          tests/test_opds_routes.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
